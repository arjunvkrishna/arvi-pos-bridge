; PlatformIO Project Configuration File for ESP32-S3-N16R8 Print Bridge
; Hardware: ESP32-S3-WROOM-1 / ESP32-S3-DevKitC-1 with 16MB Flash + 8MB Octal PSRAM

[platformio]
default_envs = esp32-s3-devkitc-1
src_dir = src
include_dir = include

[env:esp32-s3-devkitc-1]
platform = espressif32 @ 6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; Serial Monitor & Upload Speeds
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; 16MB Flash Configuration
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.partitions = default_16MB.csv

; 8MB Octal SPI (OPI) PSRAM Configuration for N16R8
board_build.arduino.memory_type = qio_opi

; Automatic .env Secret & Configuration Loader
extra_scripts = pre:load_env.py

build_flags = 
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=1
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D ARDUINO_USB_MODE=0
    -mfix-esp32-psram-cache-issue

lib_deps = 
    bblanchon/ArduinoJson @ 7.4.3
    olikraus/U8g2 @ 2.36.18
